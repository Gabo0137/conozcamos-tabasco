<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora las notas y digitaciones de la flauta de carrizo de los tamborileros de Tabasco.">
    <title>Módulo 1 — Flauta de Carrizo | Conozcamos Tabasco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="module1.css">
</head>

<body>
    <!-- ===== Encabezado conservado ===== -->
    <nav class="toolbar" id="toolbar">
        <div class="toolbar-container">
            <button class="toolbar-back" id="btnBack" aria-label="Volver a sonidos">
                <span class="toolbar-back-icon" aria-hidden="true">←</span>
            </button>
            <div class="toolbar-center">
                <h1 class="toolbar-title">Notas de la flauta de carrizo</h1>
            </div>
        </div>
    </nav>

    <main class="module-main module1-simulator-main">
        <section class="content-section active" id="sectionAudio" aria-labelledby="fluteNotesTitle">
            <div class="section-container module1-simulator-container">
                <section class="flute-notes-explorer" id="fluteNotesExplorer" aria-labelledby="fluteNotesTitle">
                    <div class="flute-notes-heading">
                        <h2 class="flute-notes-title" id="fluteNotesTitle">Explora las notas de la flauta de carrizo</h2>
                    </div>
                    <div class="flute-notes-grid" id="fluteNotesGrid"></div>
                    <p class="flute-notes-status" id="fluteNotesStatus" role="status" aria-live="polite">Selecciona «Grave» o «Agudo» para explorar una nota.</p>
                </section>
            </div>
        </section>
    </main>

    <script src="ui-sounds.js"></script>
    <script src="module1.js"></script>
</body>

</html>
